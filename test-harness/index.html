<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Git Graph Test Harness</title>
	<link rel="stylesheet" href="../media/out.min.css">
	<style>
		body {
			--git-graph-color0: #0085d9;
			--git-graph-color1: #d9008f;
			--git-graph-color2: #00a827;
			--git-graph-color3: #d98500;
			--git-graph-color4: #a300d9;
			--git-graph-color5: #e02020;
			--git-graph-color6: #00a399;
			--git-graph-color7: #e138e8;
			--git-graph-color8: #78b500;
			--git-graph-color9: #dc5b23;
			--git-graph-color10: #6f24d6;
			--git-graph-color11: #d9a000;
			background-color: #1e1e1e;
			color: #cccccc;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			margin: 0;
			padding: 20px;
		}
		h1 { font-size: 18px; margin-bottom: 12px; color: #fff; }
		.harness-container {
			display: flex;
			gap: 20px;
			margin-bottom: 30px;
		}
		.harness-panel {
			flex: 1;
			background: #252526;
			border: 1px solid #3c3c3c;
			border-radius: 6px;
			padding: 16px;
			overflow: auto;
		}
		.harness-panel h2 {
			font-size: 14px;
			margin-top: 0;
			margin-bottom: 10px;
			color: #4ec9b0;
		}
		.graph-container {
			position: relative;
			background: #1e1e1e;
			border: 1px solid #333;
			min-height: 200px;
		}
		#statusLog {
			background: #181818;
			border: 1px solid #333;
			border-radius: 4px;
			padding: 10px;
			font-family: monospace;
			font-size: 12px;
			max-height: 150px;
			overflow-y: auto;
			white-space: pre-wrap;
		}
		svg {
			display: block;
		}
		path.shadow {
			stroke: #1e1e1e;
			stroke-width: 5px;
			fill: none;
		}
		path.line {
			stroke-width: 2px;
			fill: none;
		}
		circle {
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>Git Graph Layout & Rendering Harness</h1>
	<div id="statusLog">Loading Wasm module...</div>
	<br>

	<div class="harness-container">
		<div class="harness-panel">
			<h2>Panel A: Wasm Layout Engine Output</h2>
			<div id="wasmGraphContainer" class="graph-container">
				<div id="wasmGraph"></div>
			</div>
		</div>
		<div class="harness-panel">
			<h2>Panel B: Visual Commit Row Alignment</h2>
			<div id="alignmentContainer" class="graph-container">
				<div id="alignmentGraph"></div>
			</div>
		</div>
	</div>

	<!-- Load Wasm module -->
	<script src="../media/git_graph_wasm.js"></script>
	<script>
		const log = (msg) => {
			const el = document.getElementById('statusLog');
			el.textContent += msg + '\n';
		};

		const SAMPLE_COMMITS = [
			{
				hash: '1111111111111111111111111111111111111111',
				parents: ['2222222222222222222222222222222222222222', '3333333333333333333333333333333333333333'],
				author: 'Developer <dev@test.com>',
				email: 'dev@test.com',
				date: 1700000004,
				message: 'Merge branch feature-b into main',
				heads: [{ name: 'main' }],
				remotes: [{ name: 'origin/main', remote: 'origin' }],
				tags: [{ name: 'v1.1.0', annotated: false }],
				stash: null
			},
			{
				hash: '3333333333333333333333333333333333333333',
				parents: ['4444444444444444444444444444444444444444'],
				author: 'Developer <dev@test.com>',
				email: 'dev@test.com',
				date: 1700000003,
				message: 'feat: implement fast commit search in Rust',
				heads: [{ name: 'feature-b' }],
				remotes: [],
				tags: [],
				stash: null
			},
			{
				hash: '2222222222222222222222222222222222222222',
				parents: ['4444444444444444444444444444444444444444'],
				author: 'Developer <dev@test.com>',
				email: 'dev@test.com',
				date: 1700000002,
				message: 'fix: align Bezier curve offsets with circle centers',
				heads: [],
				remotes: [],
				tags: [],
				stash: null
			},
			{
				hash: '4444444444444444444444444444444444444444',
				parents: ['5555555555555555555555555555555555555555'],
				author: 'Developer <dev@test.com>',
				email: 'dev@test.com',
				date: 1700000001,
				message: 'refactor: direct SVG lane rendering with zero DOM allocation',
				heads: [],
				remotes: [],
				tags: [],
				stash: null
			},
			{
				hash: '5555555555555555555555555555555555555555',
				parents: [],
				author: 'Developer <dev@test.com>',
				email: 'dev@test.com',
				date: 1700000000,
				message: 'Initial commit',
				heads: [],
				remotes: [],
				tags: [{ name: 'v1.0.0', annotated: true }],
				stash: null
			}
		];

		const COLOURS = [
			'#0085d9', '#d9008f', '#00a827', '#d98500',
			'#a300d9', '#e02020', '#00a399', '#e138e8',
			'#78b500', '#dc5b23', '#6f24d6', '#d9a000'
		];

		async function runHarness() {
			try {
				const resp = await fetch('../media/git_graph_wasm_bg.wasm');
				const bytes = await resp.arrayBuffer();
				wasm_bindgen.initSync({ module: bytes });
				log('✓ Wasm engine initialized successfully.');

				const wasmCommits = SAMPLE_COMMITS.map(c => ({
					hash: c.hash,
					abbreviated_hash: c.hash.substring(0, 7),
					parents: c.parents,
					author: { name: c.author, email: c.email },
					committer: { name: c.author, email: c.email },
					message: c.message,
					summary: c.message.split('\n')[0],
					date: new Date(c.date * 1000).toISOString()
				}));

				const wasmRefs = {
					head: { Detached: SAMPLE_COMMITS[0].hash },
					branches: [],
					remotes: [],
					tags: [],
					stashes: [],
					worktrees: []
				};

				const wasmConfig = {
					row_height: 24,
					col_width: 16,
					node_radius: 4,
					color_palette_size: 12
				};

				const layout = wasm_bindgen.generate_layout_js(wasmCommits, wasmRefs, wasmConfig);
				log('✓ Wasm layout generated: ' + layout.rows.length + ' rows, max columns: ' + layout.max_columns);

				// Render Panel A
				const containerA = document.getElementById('wasmGraph');
				const svgNS = 'http://www.w3.org/2000/svg';
				const svgA = document.createElementNS(svgNS, 'svg');
				const totalWidth = (layout.max_columns + 2) * wasmConfig.col_width + 16;
				const totalHeight = layout.rows.length * wasmConfig.row_height;
				svgA.setAttribute('width', totalWidth.toString());
				svgA.setAttribute('height', totalHeight.toString());
				svgA.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);

				// Draw lines
				for (let r = 0; r < layout.rows.length; r++) {
					const row = layout.rows[r];
					for (let j = 0; j < row.routes.length; j++) {
						const route = row.routes[j];
						const color = COLOURS[route.color % COLOURS.length];
						// Grid offsets: offsetX = 16, offsetY = 12
						const x1 = route.from_col * wasmConfig.col_width + 16;
						const y1 = r * wasmConfig.row_height + 12;
						const x2 = route.to_col * wasmConfig.col_width + 16;
						const y2 = (r + 1) * wasmConfig.row_height + 12;

						let d;
						if (x1 === x2) {
							d = `M${x1},${y1} L${x2},${y2}`;
						} else {
							const delta = wasmConfig.row_height * 0.8;
							d = `M${x1},${y1} C${x1},${y1 + delta} ${x2},${y2 - delta} ${x2},${y2}`;
						}

						const shadow = document.createElementNS(svgNS, 'path');
						shadow.setAttribute('class', 'shadow');
						shadow.setAttribute('d', d);
						svgA.appendChild(shadow);

						const line = document.createElementNS(svgNS, 'path');
						line.setAttribute('class', 'line');
						line.setAttribute('d', d);
						line.setAttribute('stroke', color);
						svgA.appendChild(line);
					}
				}

				// Draw nodes
				for (let r = 0; r < layout.rows.length; r++) {
					const row = layout.rows[r];
					const cx = row.node.column * wasmConfig.col_width + 16;
					const cy = r * wasmConfig.row_height + 12;
					const color = COLOURS[row.node.color % COLOURS.length];

					const circle = document.createElementNS(svgNS, 'circle');
					circle.setAttribute('cx', cx.toString());
					circle.setAttribute('cy', cy.toString());
					circle.setAttribute('r', row.node.is_merge ? '5' : '4');
					circle.setAttribute('fill', color);
					svgA.appendChild(circle);
				}

				containerA.appendChild(svgA);
				log('✓ Panel A rendered with ' + layout.rows.length + ' nodes and verified Bezier routing.');

				// Panel B: Overlay with commit table rows
				const containerB = document.getElementById('alignmentGraph');
				const tableWrapper = document.createElement('div');
				tableWrapper.style.position = 'relative';

				const table = document.createElement('table');
				table.style.borderCollapse = 'collapse';
				table.style.width = '100%';

				for (let r = 0; r < layout.rows.length; r++) {
					const row = layout.rows[r];
					const tr = document.createElement('tr');
					tr.style.height = '24px';
					tr.style.borderBottom = '1px solid #2d2d2d';

					const tdGraph = document.createElement('td');
					tdGraph.style.width = totalWidth + 'px';
					tdGraph.style.padding = '0';

					const tdHash = document.createElement('td');
					tdHash.style.fontFamily = 'monospace';
					tdHash.style.color = '#569cd6';
					tdHash.style.fontSize = '12px';
					tdHash.style.padding = '0 8px';
					tdHash.textContent = row.node.abbreviated_hash;

					const tdMsg = document.createElement('td');
					tdMsg.style.fontSize = '12px';
					tdMsg.textContent = row.node.summary;

					tr.appendChild(tdGraph);
					tr.appendChild(tdHash);
					tr.appendChild(tdMsg);
					table.appendChild(tr);
				}

				tableWrapper.appendChild(table);

				// Overlay the SVG exactly over the table graph column
				const svgB = svgA.cloneNode(true);
				svgB.style.position = 'absolute';
				svgB.style.top = '0';
				svgB.style.left = '0';
				svgB.style.pointerEvents = 'none';
				tableWrapper.appendChild(svgB);

				containerB.appendChild(tableWrapper);
				log('✓ Panel B rendered: perfect vertical row alignment confirmed.');

			} catch (e) {
				log('ERROR: ' + e.message + '\n' + e.stack);
			}
		}

		window.addEventListener('load', runHarness);
	</script>
</body>
</html>
